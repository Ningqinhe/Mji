name: build-apk-v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          set +e
          for S in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk; do
            if [ -d "$S" ]; then SDK="$S"; break; fi
          done
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null 2>&1
          for p in "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"; do
            echo "=== installing $p"
            yes | "$SM" --install "$p"
          done
          exit 0

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mji-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: M叽 调试包（自动编译）
          body: GitHub Actions 自动编译，非官方发布，仅供个人非商业使用。
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
