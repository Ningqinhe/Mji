name: build-apk-v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK pieces
        run: |
          SDK="$ANDROID_SDK_ROOT"
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          for p in "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"; do
            echo "--- $p"
            yes | "$SM" --install "$p" > /dev/null 2>&1 && echo "installed $p" || echo "skipped $p"
          done

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      -
